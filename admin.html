<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN - PRODUCCIÓN DELUXE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-body: #0A0E17;
            --bg-panel: #111827;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --gold: #D4AF37;
            --gold-hover: #B08D4A;
            --success: #059669;
            --danger: #991B1B;
            --purple: #8B5CF6; 
            --border: rgba(255, 255, 255, 0.08);
            --whatsapp: #25D366;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; padding: 20px; }
        
        #loginPanel { max-width: 380px; margin: 12vh auto; background: var(--bg-panel); padding: 40px; border-radius: 16px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); text-align: center; border: 1px solid var(--border); border-top: 4px solid var(--gold); }
        .logo-banco { font-size: 32px; letter-spacing: 4px; font-weight: 300; color: var(--gold); text-transform: uppercase; margin-bottom: 5px; }
        input { width: 100%; padding: 14px; margin: 10px 0; background: #1F2937; border: 1px solid var(--border); color: white; border-radius: 8px; box-sizing: border-box; font-size: 14px; transition: 0.3s; }
        .btn-login { width: 100%; padding: 14px; background: var(--gold); color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 15px; margin-top: 15px; transition: 0.3s; letter-spacing: 1px;}

        .panel { max-width: 850px; margin: 0 auto; background: var(--bg-panel); padding: 35px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 1px solid var(--border); }
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 25px; }
        
        .nav-botones { display: flex; gap: 10px; }
        .btn-nav { background: transparent; color: var(--gold); border: 1px solid var(--gold); text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; font-size: 11px; transition: 0.3s; letter-spacing: 1px; text-transform: uppercase;}
        .btn-nav:hover { background: var(--gold); color: #000; }
        
        .btn-cascada { background: transparent; color: var(--text-muted); border: 1px dashed var(--text-muted); padding: 15px; border-radius: 8px; width: 100%; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 25px; transition: 0.3s; letter-spacing: 1px; }

        .pedido-card { background: #1F2937; border: 1px solid var(--border); padding: 20px; margin-bottom: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid var(--gold); transition: 0.3s; }
        .pedido-card.listo { border-left-color: var(--success); background: rgba(5, 150, 105, 0.05); }
        .pedido-card.pausado { border-left-color: var(--purple); opacity: 0.85; background: #151A2B; }
        
        .info-cliente strong { font-size: 18px; color: white; }
        .info-servicio { color: var(--gold); font-size: 12px; text-transform: uppercase; font-weight: 700; display: block; margin: 5px 0;}
        .info-entrega { color: var(--text-muted); font-size: 13px; }

        .acciones-btn { display: flex; flex-direction: column; gap: 8px; }
        .btn-accion { background: transparent; border: 1px solid; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 11px; transition: 0.3s; text-transform: uppercase; min-width: 140px;}
        
        .btn-verde { color: var(--success); border-color: var(--success); }
        .btn-verde:hover { background: var(--success); color: white; }
        .btn-gris { color: var(--text-muted); border-color: var(--text-muted); }
        .btn-gris:hover { background: var(--text-muted); color: #000; }
        .btn-pausa { color: var(--purple); border-color: var(--purple); }
        .btn-pausa:hover { background: var(--purple); color: white; }
        .btn-reanudar { color: var(--gold); border-color: var(--gold); }

        .btn-wa { background: transparent; color: var(--whatsapp); border: 1px solid var(--whatsapp); padding: 8px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; margin-top: 10px; width: 100%; transition: 0.3s; text-transform: uppercase;}
        .btn-wa:hover { background: var(--whatsapp); color: #000; }

        .titulo-pausados { font-size: 13px; color: var(--purple); border-bottom: 1px solid var(--purple); padding-bottom: 8px; margin: 40px 0 20px 0; text-transform: uppercase; letter-spacing: 2px; font-weight: 800;}

        /* NOTIFICACIONES FLOTANTES */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { background: var(--success); color: white; padding: 15px 25px; border-radius: 8px; font-weight: 600; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); animation: slideIn 0.3s ease-out; display: flex; align-items: center; gap: 10px; letter-spacing: 1px; border-left: 5px solid rgba(0,0,0,0.3);}
        .toast.error { background: var(--danger); }
        .toast.info { background: var(--blue); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div id="loginPanel">
        <div class="logo-banco">DELUXE</div>
        <p id="status" style="color: var(--text-muted); font-size: 13px;">Panel de Producción</p>
        <form id="formLogin">
            <input type="email" id="email" placeholder="Usuario Administrador" required>
            <input type="password" id="password" placeholder="Clave" required>
            <button type="submit" class="btn-login">INGRESAR AL SISTEMA</button>
        </form>
    </div>

    <div id="adminPanel" style="display:none;">
        <div class="panel">
            <div class="header-flex">
                <div>
                    <h1 style="margin:0; font-size:22px; font-weight: 300;">ORDENES ACTIVAS</h1>
                    <div id="reloj" style="color:var(--gold); font-size: 13px; font-weight: 700;"></div>
                </div>
                <div class="nav-botones">
                    <a href="index.html" class="btn-nav">🏠 Dashboard</a>
                    <a href="pos.html" class="btn-nav">🛒 Caja</a>
                    <a href="estadisticas.html" class="btn-nav">📊 Finanzas</a>
                </div>
            </div>

            <button class="btn-cascada" onclick="retrasarTodo(5)">➕ RETRASAR TODA LA FILA (+5 MINUTOS)</button>

            <div id="listaPedidos"></div>
            
            <div class="titulo-pausados">⏸️ TRABAJOS PAUSADOS (NO SE BORRAN EN CIERRE)</div>
            <div id="listaPausados"></div>

            <div style="text-align: right; margin-top: 40px; border-top: 1px solid var(--border); padding-top: 20px;">
                <button onclick="firebase.auth().signOut()" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size: 11px; text-transform: uppercase;">Cerrar Sesión</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const USUARIO_GH = "edgarsc97";
        const REPO_GH = "sistema-deluxe";
        const LINK_RASTREO = `https://${USUARIO_GH}.github.io/${REPO_GH}/rastreo.html`;

        const firebaseConfig = {
            apiKey: "AIzaSyAn0H-50sbh8sMcqn_k8IlVnJX6ko58ws4",
            authDomain: "sistemafotos-cf459.firebaseapp.com",
            databaseURL: "https://sistemafotos-cf459-default-rtdb.firebaseio.com",
            projectId: "sistemafotos-cf459",
            storageBucket: "sistemafotos-cf459.firebasestorage.app",
            messagingSenderId: "599045837547",
            appId: "1:599045837547:web:7bb72110d3cf36739ea4ae"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        function mostrarNotificacion(mensaje, tipo = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`; toast.innerHTML = mensaje;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(100%)'; setTimeout(() => toast.remove(), 300); }, 3500);
        }

        auth.onAuthStateChanged(user => {
            if (user) { document.getElementById('loginPanel').style.display = 'none'; document.getElementById('adminPanel').style.display = 'block'; escucharPedidos(); } 
            else { document.getElementById('loginPanel').style.display = 'block'; document.getElementById('adminPanel').style.display = 'none'; }
        });

        document.getElementById('formLogin').addEventListener('submit', e => {
            e.preventDefault();
            auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value).catch(err => alert("Acceso Denegado"));
        });

        function escucharPedidos() {
            db.ref('turnos').on('value', snap => {
                const contActivos = document.getElementById('listaPedidos');
                const contPausados = document.getElementById('listaPausados');
                let hActivos = '', hPausados = '';
                
                if (!snap.exists()) {
                    contActivos.innerHTML = '<div style="text-align:center; padding:20px; color:gray;">No hay ordenes activas</div>';
                    contPausados.innerHTML = '<div style="text-align:center; padding:20px; color:gray;">Sin pausados</div>'; return;
                }

                let turnos = [];
                snap.forEach(c => { turnos.push({id: c.key, ...c.val()}); });
                turnos.sort((a,b) => a.timestampEntrega - b.timestampEntrega);

                turnos.forEach(p => {
                    if (p.estado === 'archivado') return;

                    const btnWA = (p.telefono && p.telefono.length >= 10) 
                        ? `<button onclick="notificarWA('${p.telefono}', '${p.nombre}', '${p.servicio}', '${p.numeroTicket}')" class="btn-wa">🟢 Avisar WhatsApp</button>` : '';

                    // BOTONES AHORA CONECTADOS AL EFECTO DOMINÓ (recalcularFilaEntera)
                    const cardHTML = `
                        <div class="pedido-card ${p.estado}">
                            <div class="info-cliente">
                                <strong>#${p.numeroTicket} - ${p.nombre}</strong>
                                <span class="info-servicio">${p.servicio}</span>
                                <span class="info-entrega">${p.estado === 'pausado' ? '⏸️ PAUSADO' : '🕒 ' + p.horaFormateada}</span>
                                ${btnWA}
                            </div>
                            <div class="acciones-btn">
                                ${p.estado === 'pendiente' ? `
                                    <button class="btn-accion btn-verde" onclick="marcarListo('${p.id}')">✅ Finalizar</button>
                                    <button class="btn-accion btn-pausa" onclick="pausarPedido('${p.id}')">⏸️ Pausar</button>
                                ` : p.estado === 'listo' ? `
                                    <button class="btn-accion btn-gris" onclick="archivarPedido('${p.id}')">📦 Archivar</button>
                                ` : `
                                    <button class="btn-accion btn-reanudar" onclick="reanudarPedido('${p.id}', ${p.minutosServicio || 15})">▶️ Reanudar</button>
                                `}
                            </div>
                        </div>`;

                    if (p.estado === 'pausado') hPausados += cardHTML;
                    else hActivos += cardHTML;
                });

                contActivos.innerHTML = hActivos || '<div style="text-align:center; padding:20px; color:gray;">Fila vacía</div>';
                contPausados.innerHTML = hPausados || '<div style="text-align:center; padding:20px; color:gray;">Sin pausados</div>';
            });
        }

        // =========================================================
        // MOTOR ABSOLUTO: RECÁLCULO TOTAL DESDE CERO
        // =========================================================
        window.recalcularFilaEntera = function(turnoIdAModificar, nuevoEstado) {
            db.ref('turnos').once('value', snap => {
                if(!snap.exists()) return;

                let turnosPendientes = [];
                let actualizaciones = {};
                
                // 1. Aplicamos el cambio de estado al turno que detonó la acción (listo o pausado)
                actualizaciones[`turnos/${turnoIdAModificar}/estado`] = nuevoEstado;
                if(nuevoEstado === 'pausado') {
                    actualizaciones[`turnos/${turnoIdAModificar}/horaFormateada`] = '--:--';
                }

                snap.forEach(c => { 
                    let t = {id: c.key, ...c.val()};
                    // 2. Extraemos únicamente a los que van a seguir esperando en la cola (y que no sean el actual)
                    if(t.estado === 'pendiente' && t.id !== turnoIdAModificar) {
                        turnosPendientes.push(t);
                    }
                });
                
                // 3. Los formamos por orden de llegada (su hora programada anterior)
                turnosPendientes.sort((a, b) => a.timestampEntrega - b.timestampEntrega);

                // 4. EL TRUCO MAGISTRAL: Iniciamos el tiempo desde "Este preciso segundo"
                let tiempoAcumulado = Date.now();

                // 5. Los volvemos a despachar uno por uno, comprimiendo la fila como un acordeón
                turnosPendientes.forEach(t => {
                    let mins = t.minutosServicio || 15; 
                    tiempoAcumulado += (mins * 60000); // Se suma el tiempo al acumulador maestro
                    
                    actualizaciones[`turnos/${t.id}/timestampEntrega`] = tiempoAcumulado;
                    actualizaciones[`turnos/${t.id}/horaFormateada`] = new Date(tiempoAcumulado).toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit', hour12:true});
                });

                // 6. Impactamos la base de datos de golpe
                db.ref().update(actualizaciones).then(() => {
                    mostrarNotificacion(`✅ Operación exitosa. La TV se ha ajustado al tiempo real.`);
                });
            });
        };

        // ACCIONES DE BOTONES
        window.marcarListo = function(id) { recalcularFilaEntera(id, 'listo'); };
        
        window.pausarPedido = function(id) {
            if(!confirm("¿Pausar este trabajo? Se quitará de la TV y la fila de clientes avanzará.")) return;
            recalcularFilaEntera(id, 'pausado');
        };

        window.archivarPedido = function(id) { db.ref('turnos/' + id).update({estado: 'archivado'}); };

        window.reanudarPedido = function(id, mins) {
            // Al reanudar a un pausado, se va al FINAL de la fila automáticamente para no ser injusto con los nuevos
            db.ref('turnos').once('value', snap => {
                let max = Date.now();
                snap.forEach(c => { if(c.val().estado === 'pendiente' && c.val().timestampEntrega > max) max = c.val().timestampEntrega; });
                const nt = max + (mins * 60000);
                db.ref('turnos/' + id).update({
                    estado: 'pendiente',
                    timestampEntrega: nt,
                    horaFormateada: new Date(nt).toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit', hour12:true})
                }).then(() => mostrarNotificacion("▶️ Trabajo reanudado al final de la fila", "info"));
            });
        };

        window.retrasarTodo = function(m) {
            if(!confirm(`¿Retrasar toda la producción ${m} minutos?`)) return;
            db.ref('turnos').once('value', snap => {
                const ups = {};
                snap.forEach(c => {
                    const v = c.val();
                    if(v.estado === 'pendiente') {
                        const nt = v.timestampEntrega + (m * 60000);
                        ups[`turnos/${c.key}/timestampEntrega`] = nt;
                        ups[`turnos/${c.key}/horaFormateada`] = new Date(nt).toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit', hour12:true});
                    }
                });
                db.ref().update(ups).then(() => mostrarNotificacion(`⏱️ Toda la fila se retrasó ${m} minutos`, "info"));
            });
        };

        window.notificarWA = function(tel, nom, serv, ticket) {
            let num = tel.replace(/\D/g, ''); if(num.length === 10) num = "52" + num;
            const msj = `¡Hola ${nom}! 👋 Tu pedido *#${ticket}* de *${serv}* está LISTO ✅.\n\nPuedes pasar a recogerlo al estudio. Si quieres ver el detalle de tu orden, entra aquí:\n🔗 ${LINK_RASTREO}`;
            window.open(`https://wa.me/${num}?text=${encodeURIComponent(msj)}`, '_blank');
        };

        setInterval(() => { document.getElementById('reloj').innerText = new Date().toLocaleTimeString('es-MX', {hour12:false}) + ' HRS'; }, 1000);
    </script>
</body>
</html>
