<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAJA - SISTEMA DELUXE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0A0E17; --bg-panel: #111827; --text-main: #F3F4F6;
            --gold: #D4AF37; --gold-hover: #B08D4A; --success: #10B981;
            --danger: #991B1B; --border: rgba(255, 255, 255, 0.08);
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; }
        
        /* LOGIN */
        #loginPanel { max-width: 380px; width: 100%; margin-top: 15vh; background: var(--bg-panel); padding: 40px; border-radius: 16px; text-align: center; border: 1px solid var(--border); border-top: 4px solid var(--gold); }
        input { width: 100%; padding: 14px; margin: 10px 0; background: #1F2937; border: 1px solid var(--border); color: white; border-radius: 8px; box-sizing: border-box; }
        .btn-gold { width: 100%; padding: 14px; background: var(--gold); color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        /* PANEL PRINCIPAL */
        .pos-container { max-width: 1100px; width: 100%; display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
        .card { background: var(--bg-panel); border-radius: 16px; border: 1px solid var(--border); padding: 25px; }
        
        .header-pos { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .btn-nav { background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 8px 15px; border-radius: 6px; text-decoration: none; font-size: 11px; font-weight: 700; text-transform: uppercase; }

        /* GRILLA DE SERVICIOS */
        .servicios-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .btn-servicio { background: #1F2937; border: 1px solid var(--border); padding: 20px 10px; border-radius: 12px; cursor: pointer; color: white; transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .btn-servicio:hover { border-color: var(--gold); transform: translateY(-3px); }
        .precio-tag { color: var(--gold); font-weight: 800; font-size: 1.1em; }

        /* CARRITO Y VENTA */
        .ticket-area { display: flex; flex-direction: column; gap: 15px; }
        .lista-items { flex: 1; min-height: 200px; border-bottom: 1px dashed var(--border); margin-bottom: 10px; }
        .total-box { font-size: 2em; font-weight: 800; text-align: right; color: var(--success); margin: 15px 0; }

        /* HISTORIAL DE VENTAS (Donde bloqueamos el reembolso) */
        .historial-ventas { grid-column: span 2; margin-top: 20px; }
        .venta-item { background: #1F2937; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--gold); }
        .btn-reembolso { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: 800; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="loginPanel">
        <h1 style="color:var(--gold); letter-spacing:4px; font-weight:300;">DELUXE</h1>
        <form id="formLogin">
            <input type="email" id="email" placeholder="Usuario de Caja" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit" class="btn-gold">Abrir Caja</button>
        </form>
    </div>

    <div id="posPanel" style="display:none; width:100%;">
        <div class="pos-container">
            <div class="header-pos card">
                <div>
                    <h2 style="margin:0; font-weight:300; letter-spacing:2px;">TERMINAL DE VENTA</h2>
                    <span id="userTag" style="font-size:11px; color:var(--gold);">Cargando...</span>
                </div>
                <div style="display:flex; gap:10px;">
                    <a href="admin.html" class="btn-nav">🛠️ PRODUCCIÓN</a>
                    <a href="estadisticas.html" class="btn-nav">📊 FINANZAS</a>
                    <button onclick="firebase.auth().signOut()" class="btn-nav" style="border-color:var(--danger); color:var(--danger);">CERRAR</button>
                </div>
            </div>

            <div class="card">
                <h3 style="margin-top:0; color:var(--gold);">SERVICIOS DISPONIBLES</h3>
                <div class="servicios-grid" id="menuServicios">
                    <button class="btn-servicio" onclick="agregarAlCarrito('Sesión Individual', 150, 15)"><span>📸 Sesión Ind.</span><span class="precio-tag">$150</span></button>
                    <button class="btn-servicio" onclick="agregarAlCarrito('Paquete Título', 450, 30)"><span>🎓 Paq. Título</span><span class="precio-tag">$450</span></button>
                    <button class="btn-servicio" onclick="agregarAlCarrito('Foto Infantil', 80, 10)"><span>👶 Infantil</span><span class="precio-tag">$80</span></button>
                    <button class="btn-servicio" onclick="agregarAlCarrito('Restauración', 300, 60)"><span>🖼️ Restauración</span><span class="precio-tag">$300</span></button>
                </div>
            </div>

            <div class="card ticket-area">
                <input type="text" id="nombreCliente" placeholder="Nombre del Cliente" style="margin:0;">
                <input type="text" id="telefonoCliente" placeholder="WhatsApp (10 dígitos)">
                <div class="lista-items" id="carritoLista"></div>
                <div class="total-box" id="displayTotal">$0.00</div>
                <button class="btn-gold" style="background:var(--success); color:white;" onclick="finalizarVenta()">💸 COBRAR E IMPRIMIR</button>
            </div>

            <div class="card historial-ventas">
                <h3 style="margin-top:0;">VENTAS RECIENTES</h3>
                <div id="listaVentasDia"></div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAn0H-50sbh8sMcqn_k8IlVnJX6ko58ws4",
            authDomain: "sistemafotos-cf459.firebaseapp.com",
            databaseURL: "https://sistemafotos-cf459-default-rtdb.firebaseio.com",
            projectId: "sistemafotos-cf459",
            storageBucket: "sistemafotos-cf459.firebasestorage.app",
            messagingSenderId: "599045837547",
            appId: "1:599045837547:web:7bb72110d3cf36739ea4ae"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- CONFIGURACIÓN DE SEGURIDAD ---
        const CORREO_ADMIN = "edgaruriel.deluxe@outlook.com"; // <--- REEMPLAZA ESTO
        let esJefe = false;
        let carrito = [];
        let totalVenta = 0;

        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                document.getElementById('loginPanel').style.display='none';
                document.getElementById('posPanel').style.display='block';
                esJefe = (user.email.toLowerCase() === CORREO_ADMIN.toLowerCase());
                document.getElementById('userTag').innerText = esJefe ? "PERFIL: ADMINISTRADOR" : "PERFIL: CAJERO";
                escucharVentas();
            } else {
                document.getElementById('loginPanel').style.display='block';
                document.getElementById('posPanel').style.display='none';
            }
        });

        document.getElementById('formLogin').addEventListener('submit', e => {
            e.preventDefault();
            firebase.auth().signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value)
                .catch(err => alert("Error de acceso"));
        });

        function agregarAlCarrito(nombre, precio, mins) {
            carrito.push({nombre, precio, mins});
            actualizarInterfazCarrito();
        }

        function actualizarInterfazCarrito() {
            const lista = document.getElementById('carritoLista');
            lista.innerHTML = '';
            totalVenta = 0;
            carrito.forEach((item, index) => {
                totalVenta += item.precio;
                lista.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:5px; font-size:14px;">
                    <span>${item.nombre}</span>
                    <span>$${item.precio} <button onclick="carrito.splice(${index},1); actualizarInterfazCarrito();" style="background:none; border:none; color:red; cursor:pointer;">✕</button></span>
                </div>`;
            });
            document.getElementById('displayTotal').innerText = `$${totalVenta.toFixed(2)}`;
        }

        function finalizarVenta() {
            const nombre = document.getElementById('nombreCliente').value;
            if(!nombre || carrito.length === 0) return alert("Faltan datos");

            const ticketNum = Math.floor(1000 + Math.random() * 9000);
            const ahora = Date.now();
            const fecha = new Date().toLocaleDateString();
            
            // 1. Guardar en Ventas
            const nuevaVenta = {
                ticket: ticketNum,
                cliente: nombre,
                total: totalVenta,
                fecha: fecha,
                timestamp: ahora,
                pago: "Efectivo"
            };

            // 2. Mandar a Producción (Turnos)
            let tiempoTotalMins = 0;
            carrito.forEach(i => tiempoTotalMins += i.mins);

            db.ref('ventas').push(nuevaVenta);
            db.ref('turnos').push({
                nombre: nombre,
                servicio: carrito[0].nombre + (carrito.length > 1 ? ' + otros' : ''),
                estado: 'pendiente',
                timestampEntrega: ahora + (tiempoTotalMins * 60000),
                horaFormateada: new Date(ahora + (tiempoTotalMins * 60000)).toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit', hour12:true}),
                telefono: document.getElementById('telefonoCliente').value,
                numeroTicket: ticketNum
            });

            alert(`Venta Exitosa #${ticketNum}`);
            carrito = [];
            document.getElementById('nombreCliente').value = '';
            document.getElementById('telefonoCliente').value = '';
            actualizarInterfazCarrito();
        }

        function escucharVentas() {
            db.ref('ventas').limitToLast(10).on('value', snap => {
                const cont = document.getElementById('listaVentasDia');
                cont.innerHTML = '';
                if(!snap.exists()) return;

                snap.forEach(child => {
                    const v = child.val();
                    // AQUÍ ESTÁ EL BLOQUEO: Solo si esJefe se muestra el botón de Reembolso
                    const btnReembolso = esJefe ? `<button class="btn-reembolso" onclick="reembolsar('${child.key}')">Reembolsar</button>` : '';
                    
                    cont.innerHTML += `<div class="venta-item">
                        <div>
                            <strong>#${v.ticket} - ${v.cliente}</strong><br>
                            <small style="color:var(--success)">$${v.total.toFixed(2)}</small>
                        </div>
                        ${btnReembolso}
                    </div>`;
                });
            });
        }

        window.reembolsar = function(key) {
            if(!confirm("¿Deseas anular esta venta y devolver el dinero?")) return;
            db.ref('ventas/' + key).remove().then(() => alert("Venta Reembolsada"));
        };
    </script>
</body>
</html>
