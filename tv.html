<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONITOR TV - SISTEMA DELUXE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
           1. VARIABLES Y ESTILOS GLOBALES DELUXE
        ========================================== */
        :root {
            --bg-body: #05080f; 
            --bg-caja: rgba(17, 24, 39, 0.7); 
            --texto-principal: #F3F4F6;
            --texto-secundario: #9CA3AF;
            --acento-proceso: #D4AF37; 
            --acento-listo: #10B981; 
            --purple: #8B5CF6; 
            --blue: #3b82f6;
            --cristal-border: rgba(255, 255, 255, 0.1);
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at top right, #111827, #05080f); 
            color: var(--texto-principal); 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
            box-sizing: border-box;
        }
        
        /* ==========================================
           2. HEADER COMPACTO Y ELEGANTE
        ========================================== */
        .header-deluxe { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 30px; 
            background: var(--bg-caja); 
            border-radius: 12px; 
            border-bottom: 2px solid var(--acento-proceso); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
            backdrop-filter: blur(10px); 
            z-index: 10; 
            margin-bottom: 15px;
        }
        
        .logo-tv { 
            font-size: 22px; 
            font-weight: 300; 
            letter-spacing: 5px; 
            margin: 0; 
            color: white;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        
        .logo-tv span { 
            color: var(--acento-proceso); 
            font-weight: 800;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
        
        #reloj { 
            margin: 0; 
            font-size: 1.8em; 
            font-weight: 800; 
            letter-spacing: 3px; 
            color: white;
        }
        
        #pantallaDinamica { 
            position: relative; 
            flex: 1; 
            overflow: hidden; 
        }

        /* ==========================================
           3. VISTA: COLAS DE PRODUCCIÓN
        ========================================== */
        #vistaColas { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            width: 100%; 
            height: 100%; 
            position: absolute; 
            top: 0; 
            left: 0; 
            transition: opacity 1s ease-in-out; 
            opacity: 1; 
            z-index: 5;
        }
        
        .columnas-principales { 
            display: flex; 
            gap: 20px; 
            flex: 1; 
            overflow: hidden; 
        }
        
        .columna { 
            flex: 1; 
            background: var(--bg-caja); 
            border-radius: 16px; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.4); 
            backdrop-filter: blur(10px);
            border: 1px solid var(--cristal-border);
        }
        
        .columna h2 { 
            font-size: 1.2em; 
            margin: 0 0 15px 0; 
            border-bottom: 1px dashed rgba(255,255,255,0.1); 
            padding-bottom: 10px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        
        /* ==========================================
           4. TARJETAS DE TURNO (MAGIA Y NEÓN)
        ========================================== */
        .turno { 
            background: rgba(31, 41, 55, 0.6); 
            margin-bottom: 12px; 
            padding: 15px; 
            border-radius: 12px; 
            border-left: 5px solid var(--acento-proceso); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            animation: entrada-tarjeta 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            border-right: 1px solid var(--cristal-border);
            border-top: 1px solid var(--cristal-border);
            border-bottom: 1px solid var(--cristal-border);
        }
        
        .turno:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .turno.listo { 
            border-left-color: var(--acento-listo); 
            background: linear-gradient(90deg, rgba(16, 185, 129, 0.1) 0%, rgba(31, 41, 55, 0.6) 100%);
            animation: resplandor-verde 2s infinite; 
        }
        
        .turno.en-turno {
            border-left-color: var(--blue);
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.15) 0%, rgba(31, 41, 55, 0.8) 100%);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        .turno.en-turno::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            animation: escaner-luz 3s infinite;
        }

        .turno-info { 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            z-index: 2; 
        }
        
        .nombre { 
            font-size: 1.4em; 
            font-weight: 800; 
            color: white; 
            line-height: 1.1; 
            display: flex; 
            align-items: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        
        .descripcion-servicio { 
            font-size: 0.8em; 
            color: var(--acento-proceso); 
            font-weight: 600; 
            letter-spacing: 1px; 
            text-transform: uppercase; 
            background: rgba(212, 175, 55, 0.15); 
            padding: 3px 8px; 
            border-radius: 6px; 
            width: fit-content; 
            margin-top: 4px;
        }

        .item-desc-tv {
            font-size: 0.75em;
            color: var(--texto-secundario);
            font-style: italic;
            margin-top: 2px;
            font-weight: 300;
        }
        
        .turno.listo .descripcion-servicio { 
            color: var(--acento-listo); 
            background: rgba(16, 185, 129, 0.15); 
        }
        
        .turno.en-turno .descripcion-servicio { 
            color: var(--blue); 
            background: rgba(59, 130, 246, 0.15); 
        }

        .badge-en-turno {
            background: var(--blue);
            color: white;
            font-size: 0.55em;
            padding: 4px 10px;
            border-radius: 6px;
            vertical-align: middle;
            margin-left: 10px;
            letter-spacing: 1px;
            animation: parpadeo-suave 1.5s infinite;
            display: inline-block;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .badge-vip-tv { 
            background: linear-gradient(45deg, var(--acento-proceso), #FFF8D6); 
            color: black; 
            font-size: 0.55em; 
            padding: 4px 8px; 
            border-radius: 6px; 
            vertical-align: middle; 
            margin-left: 8px; 
            letter-spacing: 1px;
            font-weight: 800;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }
        
        .bloque-tiempo { 
            text-align: right; 
            min-width: 110px; 
            display: flex; 
            flex-direction: column; 
            align-items: flex-end; 
            justify-content: center;
            z-index: 2;
        }
        
        .texto-estimado { 
            font-size: 0.65em; 
            color: var(--texto-secundario); 
            font-weight: 600; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            margin-bottom: 2px;
        }
        
        .timer-regresivo { 
            font-size: 1.8em; 
            font-weight: 800; 
            color: var(--acento-proceso); 
            font-variant-numeric: tabular-nums; 
            line-height: 1;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }
        
        .turno.en-turno .timer-regresivo { 
            color: #60A5FA; 
            text-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }
        
        .hora-fija-tv { 
            font-size: 0.75em; 
            color: var(--texto-secundario); 
            margin-top: 4px; 
            font-weight: 600; 
            letter-spacing: 1px;
        }
        
        .status-txt-listo { 
            font-size: 1.6em; 
            font-weight: 800; 
            color: var(--acento-listo); 
            text-transform: uppercase; 
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        /* ==========================================
           5. CARRUSEL DE PAUSADOS (MARQUESINA)
        ========================================== */
        .barra-pausados { 
            background: rgba(15, 23, 42, 0.8); 
            border: 1px solid var(--purple); 
            border-radius: 12px; 
            padding: 10px 20px; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            box-shadow: 0 5px 25px rgba(139, 92, 246, 0.2); 
            animation: entrada-suave 0.5s ease-out; 
            margin-top: 5px;
            backdrop-filter: blur(10px);
        }
        
        .titulo-pausados-tv { 
            color: #C4B5FD; 
            font-weight: 800; 
            font-size: 0.9em; 
            text-transform: uppercase; 
            white-space: nowrap; 
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
        }
        
        .contenedor-pausados { 
            display: flex; 
            flex: 1; 
            overflow: hidden; 
            align-items: center; 
        }
        
        .badge-pausado { 
            background: rgba(139, 92, 246, 0.2); 
            color: white; 
            padding: 6px 15px; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 0.9em; 
            border: 1px solid rgba(139, 92, 246, 0.5); 
            margin-right: 20px; 
            display: inline-block;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
        }

        /* ==========================================
           6. LETRERO MÁGICO DE "LA FILA AVANZA"
        ========================================== */
        .alerta-ahorro {
            position: fixed;
            top: -200px; /* Escondido arriba por defecto */
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #FFD700, #F59E0B);
            border: 3px solid white;
            color: black;
            padding: 20px 50px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 28px;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 20px 50px rgba(212, 175, 55, 0.8);
            z-index: 9999999; /* Por encima de todo, sin lugar a dudas */
            display: flex;
            align-items: center;
            gap: 20px;
            opacity: 0;
            pointer-events: none;
            /* Transición rápida y fluida */
            transition: top 0.5s ease-in-out, opacity 0.5s ease-in-out;
        }

        .alerta-ahorro.mostrar {
            opacity: 1;
            top: 60px; /* Baja y se muestra */
            pointer-events: auto;
            animation: vibrar-magia 0.5s infinite alternate; /* Animación más agresiva y festiva */
        }

        .icono-fuego {
            font-size: 40px;
            animation: saltar-fuego 0.5s infinite alternate;
        }

        @keyframes vibrar-magia {
            0% { transform: translateX(-50%) scale(1); box-shadow: 0 20px 50px rgba(212, 175, 55, 0.8); }
            100% { transform: translateX(-50%) scale(1.05); box-shadow: 0 20px 80px rgba(255, 255, 255, 0.8); }
        }

        @keyframes saltar-fuego {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-10px) scale(1.2); }
        }

        /* ==========================================
           7. KEYFRAMES GLOBALES
        ========================================== */
        @keyframes entrada-tarjeta { 
            0% { opacity: 0; transform: translateX(-30px) scale(0.95); } 
            100% { opacity: 1; transform: translateX(0) scale(1); } 
        }

        @keyframes entrada-suave {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes escaner-luz {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }
        
        @keyframes resplandor-verde { 
            0%, 100% { border-color: var(--acento-listo); box-shadow: 0 0 15px rgba(16, 185, 129, 0.1); } 
            50% { border-color: white; box-shadow: 0 0 30px rgba(16, 185, 129, 0.4); } 
        }
        
        @keyframes parpadeo-suave { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.6; } 
        }

        @keyframes preparacion-dorada {
            0%, 100% { opacity: 1; text-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
            50% { opacity: 0.7; text-shadow: 0 0 20px rgba(16, 185, 129, 1); }
        }

        /* ==========================================
           8. VISTA: ANUNCIOS DINÁMICOS
        ========================================== */
        #vistaPromos { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            transition: opacity 1s ease-in-out; 
            opacity: 0; 
            z-index: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #000; 
            border-radius: 16px; 
            overflow: hidden; 
        }
        
        #contenedorMedios { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .promo-medio { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            opacity: 0; 
            transition: opacity 1s ease-in-out; 
            filter: brightness(0.8); 
        }
        
        .promo-medio.activa { opacity: 1; }
        
        .aviso-retorno { 
            position: absolute; 
            bottom: 30px; 
            background: rgba(0,0,0,0.8); 
            padding: 12px 25px; 
            border-radius: 30px; 
            border: 1px solid var(--acento-proceso); 
            color: white; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-size: 0.9em; 
            z-index: 20; 
            backdrop-filter: blur(10px); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
        }

        /* ==========================================
           9. QR FLOTANTE Y PANTALLA DE INICIO
        ========================================== */
        .qr-flotante { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            background: rgba(17, 24, 39, 0.85); 
            border: 1px solid var(--acento-proceso); 
            border-radius: 16px; 
            padding: 15px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 15px rgba(212,175,55,0.2); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            z-index: 50; 
            animation: flotar-lujo 4s ease-in-out infinite; 
            backdrop-filter: blur(15px);
        }
        
        .qr-texto { 
            text-align: center; 
            font-size: 11px; 
            font-weight: 600; 
            color: var(--texto-secundario); 
            margin-bottom: 8px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        
        .qr-texto span { 
            color: var(--acento-proceso); 
            font-size: 14px; 
            display: block; 
            margin-top: 4px; 
            font-weight: 800;
            text-shadow: 0 0 5px rgba(212,175,55,0.4);
        }
        
        .qr-img { width: 85px; height: 85px; border-radius: 8px; background: white; padding: 6px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);}

        @keyframes flotar-lujo { 
            0% { transform: translateY(0px); box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 15px rgba(212,175,55,0.2); } 
            50% { transform: translateY(-8px); box-shadow: 0 25px 45px rgba(0,0,0,0.9), inset 0 0 25px rgba(212,175,55,0.4); } 
            100% { transform: translateY(0px); box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 15px rgba(212,175,55,0.2); } 
        }

        #pantallaInicio { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: var(--bg-body); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
            flex-direction: column; 
        }
        
        .btn-inicio { 
            padding: 25px 50px; 
            font-size: 24px; 
            background: linear-gradient(135deg, var(--acento-proceso), #FFEA8C); 
            color: #000; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 800; 
            text-transform: uppercase; 
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.5); 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            letter-spacing: 3px;
        }
        
        .btn-inicio:hover { transform: scale(1.08); box-shadow: 0 15px 40px rgba(212, 175, 55, 0.7); }
    </style>
</head>
<body>

    <div id="alertaAhorro" class="alerta-ahorro">
        <span class="icono-fuego">🔥</span>
        <span>¡LA FILA AVANZA! TIEMPO AHORRADO: -<span id="txtAhorroMins">10</span> MINUTOS</span>
        <span class="icono-fuego">🔥</span>
    </div>

    <div id="pantallaInicio">
        <h1 style="color: var(--acento-proceso); margin-bottom: 40px; letter-spacing:10px; font-weight:300; font-size:3em; text-shadow: 0 0 20px rgba(212,175,55,0.3);">MONITOR <strong style="font-weight:800;">TV</strong></h1>
        <button class="btn-inicio" onclick="window.iniciarSistema()">ENCENDER PANTALLA</button>
        <p style="color: var(--texto-secundario); margin-top: 30px; font-size: 14px; letter-spacing: 3px; text-transform:uppercase;">Sistema de Producción Deluxe</p>
    </div>

    <div class="header-deluxe">
        <h1 class="logo-tv">ESTUDIO <span>DELUXE</span></h1>
        <h1 id="reloj">00:00:00</h1>
    </div>

    <div id="pantallaDinamica">
        
        <div id="vistaColas">
            <div class="columnas-principales">
                
                <div class="columna">
                    <h2 style="color:var(--acento-proceso); text-align: center; letter-spacing: 4px; font-weight: 300;">⏳ EN PROCESO</h2>
                    <div id="listaProceso" style="overflow-y: auto; padding-right: 5px; flex:1;"></div>
                </div>

                <div class="columna">
                    <h2 style="color:var(--acento-listo); text-align: center; letter-spacing: 4px; font-weight: 300;">✅ PARA ENTREGAR</h2>
                    <div id="listaListos" style="overflow-y: auto; padding-right: 5px; flex:1;"></div>
                </div>

            </div>
            
            <div class="barra-pausados" id="barraPausadosContainer" style="display: none;">
                <div class="titulo-pausados-tv">⏸️ PAUSADOS:</div>
                <div class="contenedor-pausados">
                    <marquee id="listaPausadosTv" scrollamount="7" scrolldelay="50"></marquee>
                </div>
            </div>
        </div>

        <div id="vistaPromos">
            <div id="contenedorMedios"></div>
            <div class="aviso-retorno">Tu turno aparecerá en pantalla en breve...</div>
        </div>

    </div>

    <div class="qr-flotante">
        <div class="qr-texto">
            ¿Deseas salir?
            <span>Rastrea tu orden</span>
        </div>
        <img src="qr-code.png" alt="QR" class="qr-img">
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAn0H-50sbh8sMcqn_k8IlVnJX6ko58ws4",
            authDomain: "sistemafotos-cf459.firebaseapp.com",
            databaseURL: "https://sistemafotos-cf459-default-rtdb.firebaseio.com",
            projectId: "sistemafotos-cf459",
            storageBucket: "sistemafotos-cf459.firebasestorage.app",
            messagingSenderId: "599045837547",
            appId: "1:599045837547:web:7bb72110d3cf36739ea4ae"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // VARIABLES DE CONTROL
        let primeraCarga = true;
        let ultimosListos = [];
        let totalFila = 0;
        let timerInactividad;
        let timerRetorno;
        let timerCartelAhorro;
        window.ultimoCP = 0; 
        
        // CARRUSEL
        let listaMediosGlobal = [];
        let indexMedio = 0;
        let timerCarrusel;
        let vozHabilitada = true; 
        
        // =========================================================
        // INICIALIZACIÓN DE LA TV
        // =========================================================
        window.iniciarSistema = function() {
            // Desbloquear la Voz en navegadores estrictos
            if ('speechSynthesis' in window) {
                let msgVacio = new SpeechSynthesisUtterance('');
                msgVacio.volume = 0;
                window.speechSynthesis.speak(msgVacio);
            }
            
            document.getElementById('pantallaInicio').style.display = 'none';
            
            db.ref('configuracion/tvVoz').on('value', snap => {
                if(snap.exists()) vozHabilitada = snap.val().activo;
            });
            
            cargarConfiguracionTV();
            escucharTurnos();
            escucharAhorroDeTiempo(); // Lanza el cartel mágico
            resetLogicaVista();
            setInterval(actualizarCronometros, 1000);
        };

        // =========================================================
        // EFECTO MAGICO: LA FILA AVANZA (POR RUTA SEGURA)
        // =========================================================
        let ultimoIdAlerta = 0;

        function escucharAhorroDeTiempo() {
            // 🔔 AHORA ESCUCHA EN LA CARPETA 'configuracion' QUE SÍ TIENE PERMISOS 🔔
            db.ref('configuracion/tvAlertaAhorro').on('value', snap => {
                if(!snap.exists()) return;
                
                const data = snap.val();
                
                // Evitamos que se dispare dos veces el mismo evento
                if (data.id === ultimoIdAlerta) return;
                ultimoIdAlerta = data.id;

                // Solo muestra si ocurrió hace menos de 10 segundos
                if (Date.now() - data.timestamp < 10000) {
                    mostrarCartelMagico(data.minutos);
                }
            });
        }

        function mostrarCartelMagico(minutos) {
            const cartel = document.getElementById('alertaAhorro');
            document.getElementById('txtAhorroMins').innerText = minutos;
            
            // 🔔 USAMOS UN ARCHIVO LOCAL QUE YA SABEMOS QUE FUNCIONA 🔔
            let audioAhorro = new Audio('nuevo.mp3'); 
            audioAhorro.play().catch(e => console.log('Audio bloqueado:', e));
            
            cartel.classList.add('mostrar');
            
            // Lo ocultamos después de 6 segundos
            clearTimeout(timerCartelAhorro);
            timerCartelAhorro = setTimeout(() => {
                cartel.classList.remove('mostrar');
            }, 6000); 
        }

        // =========================================================
        // REPRODUCTOR DE ANUNCIOS (CARRUSEL)
        // =========================================================
        function cargarConfiguracionTV() {
            db.ref('configuracion/tv/medios').on('value', snap => {
                const cont = document.getElementById('contenedorMedios');
                cont.innerHTML = ''; 
                listaMediosGlobal = [];
                
                if(snap.exists()) {
                    snap.forEach(child => {
                        const m = { id: child.key, ...child.val() };
                        listaMediosGlobal.push(m);
                        if(m.tipo === 'video') {
                            cont.innerHTML += `<video id="med_${m.id}" class="promo-medio" src="${m.url}" muted playsinline></video>`;
                        } else {
                            cont.innerHTML += `<img id="med_${m.id}" class="promo-medio" src="${m.url}">`;
                        }
                    });
                } else {
                    cont.innerHTML = `<img id="med_default" class="promo-medio activa" src="logo.png" style="object-fit: contain; filter: invert(1); padding: 50px;">`;
                    listaMediosGlobal.push({ id: 'default', tipo: 'imagen', duracion: 15 });
                }
                
                clearTimeout(timerCarrusel); 
                indexMedio = 0; 
                reproducirSiguienteMedio();
            });
        }

        function reproducirSiguienteMedio() {
            if (listaMediosGlobal.length === 0) return;
            
            document.querySelectorAll('.promo-medio').forEach(el => {
                el.classList.remove('activa');
                if (el.tagName === 'VIDEO') el.pause();
            });
            
            const actual = listaMediosGlobal[indexMedio];
            const el = document.getElementById('med_' + actual.id);
            
            if (el) {
                el.classList.add('activa');
                if (actual.tipo === 'video') { 
                    el.currentTime = 0; 
                    el.play().catch(e => console.log(e)); 
                }
            }
            
            const duracionMs = (actual.duracion || 10) * 1000;
            indexMedio = (indexMedio + 1) % listaMediosGlobal.length;
            timerCarrusel = setTimeout(reproducirSiguienteMedio, duracionMs);
        }

        // =========================================================
        // CONTROL DE VISTAS (TV / ANUNCIOS)
        // =========================================================
        function resetLogicaVista() {
            clearTimeout(timerInactividad); 
            clearTimeout(timerRetorno);
            
            document.getElementById('vistaColas').style.opacity = '1'; 
            document.getElementById('vistaColas').style.zIndex = '5';
            
            document.getElementById('vistaPromos').style.opacity = '0'; 
            document.getElementById('vistaPromos').style.zIndex = '1';
            
            // Si pasan 25 segundos sin que toques la caja, entran los comerciales
            timerInactividad = setTimeout(mostrarAnuncios, 25000);
        }

        function mostrarAnuncios() {
            document.getElementById('vistaPromos').style.opacity = '1'; 
            document.getElementById('vistaPromos').style.zIndex = '5';
            
            document.getElementById('vistaColas').style.opacity = '0'; 
            document.getElementById('vistaColas').style.zIndex = '1';
            
            // Vuelve a la TV después de 10 segundos
            if (totalFila > 0) {
                timerRetorno = setTimeout(resetLogicaVista, 10000);
            }
        }

        function vocearIA(nombre) {
            const audio = new Audio('listo.mp3');
            audio.play().then(() => {
                if(vozHabilitada) {
                    setTimeout(() => {
                        const msg = new SpeechSynthesisUtterance(`Atención. El pedido de ${nombre}, está listo para entregar.`);
                        msg.lang = 'es-MX'; 
                        msg.rate = 0.85; 
                        window.speechSynthesis.speak(msg);
                    }, 1200);
                }
            }).catch(e => console.log("Bloqueo de Audio:", e));
        }

        // =========================================================
        // CRONÓMETRO REGRESIVO (LA MAGIA DE LA ESPERA CERO)
        // =========================================================
        function actualizarCronometros() {
            document.querySelectorAll('.timer-regresivo').forEach(el => {
                const entrega = parseInt(el.getAttribute('data-entrega'));
                if(!entrega) return;
                
                const ahora = Date.now();
                let diff = Math.floor((entrega - ahora) / 1000); 
                
                if (diff <= 0) { 
                    // Cuando llega a Cero, desaparece el reloj y se pone en verde
                    el.innerHTML = '<span style="color: var(--acento-listo); font-size: 0.7em; animation: preparacion-dorada 2s infinite;">✨ PREPARANDO ENTREGA</span>';
                } else {
                    // Minutos Naturales
                    const min = Math.floor(diff / 60); 
                    const sec = diff % 60;
                    el.innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
                }
            });
        }

        // =========================================================
        // MOTOR PRINCIPAL DE COLAS DE TV (LÍMITE A 7 LISTOS)
        // =========================================================
        function escucharTurnos() {
            db.ref('turnos').on('value', snapshot => {
                const listaP = document.getElementById('listaProceso'); 
                const listaL = document.getElementById('listaListos');
                const listaPausadosTv = document.getElementById('listaPausadosTv'); 
                const barraPausadosCont = document.getElementById('barraPausadosContainer');
                
                listaP.innerHTML = ''; 
                listaL.innerHTML = ''; 
                let htmlPausados = '';
                
                let pendientes = [];
                let listos = [];
                let pausados = [];

                if(snapshot.exists()) {
                    snapshot.forEach(child => {
                        let val = child.val();
                        if(val.estado === 'pendiente') {
                            pendientes.push({id: child.key, ...val});
                        } else if(val.estado === 'listo') {
                            listos.push({id: child.key, ...val});
                        } else if(val.estado === 'pausado') {
                            pausados.push({id: child.key, ...val});
                        }
                    });
                }
                
                // ORDENAR PENDIENTES (El que sale primero, va arriba)
                pendientes.sort((a, b) => a.timestampEntrega - b.timestampEntrega);
                
                // ORDENAR LISTOS (Los finalizados más recientemente, van arriba)
                listos.sort((a, b) => (b.timestampEstado || b.timestampEntrega) - (a.timestampEstado || a.timestampEntrega));

                // 1. GENERAR COLUMNA "EN PROCESO"
                let esPrimeroEnFila = true;
                
                pendientes.forEach(t => {
                    // DESCRIPCIÓN DEL PAQUETE EN PEQUEÑO
                    let detallesHtml = '';
                    if (t.carrito) {
                        t.carrito.forEach(item => {
                            if (item.descripcion) {
                                detallesHtml += `<div class="item-desc-tv">↳ ${item.cantidad}x ${item.descripcion}</div>`;
                            }
                        });
                    }

                    const tituloServicio = t.servicio ? `<span class="descripcion-servicio">${t.servicio}</span>` : '';
                    const etiquetaVIP = t.esVIP ? `<span class="badge-vip-tv">⭐ VIP</span>` : '';
                    
                    let claseExtra = '';
                    let etiquetaAtendiendo = '';

                    // Al primero de la fila lo iluminamos de Azul y le pasamos el rayo escáner
                    if (esPrimeroEnFila) {
                        claseExtra = 'en-turno';
                        etiquetaAtendiendo = `<span class="badge-en-turno">👉 EN TURNO</span>`;
                        esPrimeroEnFila = false;
                    }

                    listaP.innerHTML += `
                        <div class="turno ${claseExtra}">
                            <div class="turno-info">
                                <span class="nombre">${t.nombre} ${etiquetaAtendiendo} ${etiquetaVIP}</span>
                                ${tituloServicio}
                                ${detallesHtml}
                            </div>
                            <div class="bloque-tiempo">
                                <span class="texto-estimado">ESTIMADO</span>
                                <span class="timer-regresivo" data-entrega="${t.timestampEntrega}">--:--</span>
                                <span class="hora-fija-tv">⏰ ${t.horaFormateada}</span>
                            </div>
                        </div>`;
                });

                // 2. 🔔 GENERAR COLUMNA "LISTOS" (LÍMITE A LOS 7 MÁS RECIENTES) 🔔
                const MAX_LISTOS = 7; 
                let listosMostrados = listos.slice(0, MAX_LISTOS);

                listosMostrados.forEach(t => {
                    const tituloServicio = t.servicio ? `<span class="descripcion-servicio">${t.servicio}</span>` : '';
                    const etiquetaVIP = t.esVIP ? `<span class="badge-vip-tv">⭐ VIP</span>` : '';
                    
                    listaL.innerHTML += `
                        <div class="turno listo">
                            <div class="turno-info">
                                <span class="nombre">${t.nombre} ${etiquetaVIP}</span>
                                ${tituloServicio}
                            </div>
                            <span class="status-txt-listo">RECOGER</span>
                        </div>`;
                });

                // 3. GENERAR BARRA DE PAUSADOS (MARQUESINA INFERIOR)
                pausados.forEach(t => {
                    htmlPausados += `<span class="badge-pausado">${t.nombre} - ${t.servicio}</span>`;
                });

                // ACTUALIZAR ESTADOS GLOBALES Y VISIBILIDAD
                actualizarCronometros();
                totalFila = pendientes.length + listos.length;

                if (pausados.length > 0) { 
                    listaPausadosTv.innerHTML = htmlPausados; 
                    barraPausadosCont.style.display = 'flex'; 
                } else { 
                    barraPausadosCont.style.display = 'none'; 
                    listaPausadosTv.innerHTML = ''; 
                }

                // 4. LÓGICA DE AUDIOS (VOCEO Y CAMPANITA)
                let listosActualesIds = listos.map(t => t.id);
                
                if (!primeraCarga) {
                    // Solo vocear si el ID es nuevo en la lista de listos
                    listos.forEach(nuevo => { 
                        if (!ultimosListos.includes(nuevo.id)) {
                            vocearIA(nuevo.nombre); 
                        }
                    });
                    
                    // Solo tocar campanita si hay MÁS pendientes que antes (alguien nuevo entró a la fila)
                    if (pendientes.length > window.ultimoCP) {
                        new Audio('nuevo.mp3').play().catch(e => console.log(e));
                    }
                    
                    resetLogicaVista();
                }

                ultimosListos = listosActualesIds; 
                window.ultimoCP = pendientes.length; 
                primeraCarga = false;
            });
        }

        // Iniciar reloj digital de la cabecera
        setInterval(() => { 
            document.getElementById('reloj').innerText = new Date().toLocaleTimeString('es-MX', {hour12: false}); 
        }, 1000);

    </script>
