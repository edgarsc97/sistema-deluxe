<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONITOR TV - SISTEMA DELUXE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* ==========================================
           VARIABLES Y ESTILOS GLOBALES
        ========================================== */
        :root {
            --bg-body: #0A0E17; 
            --bg-caja: #111827; 
            --texto-principal: #F3F4F6;
            --texto-secundario: #9CA3AF;
            --acento-proceso: #D4AF37; 
            --acento-listo: #10B981; 
            --purple: #8B5CF6; 
            --blue: #3b82f6;
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-body); 
            color: var(--texto-principal); 
            margin: 0; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        /* ==========================================
           HEADER COMPACTO
        ========================================== */
        .header-deluxe { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 20px; 
            background: var(--bg-caja); 
            border-radius: 10px; 
            border-bottom: 3px solid var(--acento-proceso); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); 
            z-index: 10; 
            margin-bottom: 10px;
        }
        
        .logo-tv { 
            font-size: 20px; 
            font-weight: 300; 
            letter-spacing: 4px; 
            margin: 0; 
            color: white;
        }
        
        .logo-tv span { 
            color: var(--acento-proceso); 
            font-weight: 800;
        }
        
        #reloj { 
            margin: 0; 
            font-size: 1.6em; 
            font-weight: 800; 
            letter-spacing: 3px; 
        }
        
        #pantallaDinamica { 
            position: relative; 
            flex: 1; 
            overflow: hidden; 
        }

        /* ==========================================
           VISTA 1: COLAS DE PRODUCCIÓN
        ========================================== */
        #vistaColas { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            width: 100%; 
            height: 100%; 
            position: absolute; 
            top: 0; 
            left: 0; 
            transition: opacity 1s ease-in-out; 
            opacity: 1; 
            z-index: 5;
        }
        
        .columnas-principales { 
            display: flex; 
            gap: 15px; 
            flex: 1; 
            overflow: hidden; 
        }
        
        .columna { 
            flex: 1; 
            background: var(--bg-caja); 
            border-radius: 10px; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5); 
        }
        
        .columna h2 { 
            font-size: 1.1em; 
            margin: 0 0 10px 0; 
            border-bottom: 1px dashed rgba(255,255,255,0.1); 
            padding-bottom: 8px;
        }
        
        /* ==========================================
           TARJETAS DE TURNO
        ========================================== */
        .turno { 
            background: #1F2937; 
            margin-bottom: 8px; 
            padding: 10px 12px; 
            border-radius: 8px; 
            border-left: 5px solid var(--acento-proceso); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            animation: entrada 0.4s ease-out; 
            box-shadow: 0 3px 10px rgba(0,0,0,0.2); 
            transition: 0.3s;
        }
        
        .turno.listo { 
            border-left-color: var(--acento-listo); 
            background: rgba(16, 185, 129, 0.05); 
            animation: parpadeo-listo 2s infinite; 
        }
        
        .turno-info { 
            display: flex; 
            flex-direction: column; 
            gap: 2px; 
        }
        
        /* EFECTO PARA EL CLIENTE "EN TURNO" (EL PRIMERO) */
        .turno.en-turno {
            border-left-color: var(--blue);
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.15) 0%, rgba(31, 41, 55, 1) 40%);
            animation: pulso-activo 2s infinite;
        }
        
        .badge-en-turno {
            background: var(--blue);
            color: white;
            font-size: 0.55em;
            padding: 3px 8px;
            border-radius: 4px;
            vertical-align: middle;
            margin-left: 8px;
            letter-spacing: 1px;
            animation: parpadeo-suave 1.5s infinite;
            display: inline-block;
        }

        @keyframes pulso-activo { 
            0%, 100% { box-shadow: 0 0 5px rgba(59, 130, 246, 0.2); } 
            50% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); } 
        }
        
        @keyframes parpadeo-suave { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.6; } 
        }

        @keyframes entrada { 
            from { opacity: 0; transform: translateX(-15px); } 
            to { opacity: 1; transform: translateX(0); } 
        }
        
        @keyframes parpadeo-listo { 
            0%, 100% { border-color: var(--acento-listo); box-shadow: 0 0 10px rgba(16, 185, 129, 0.1); } 
            50% { border-color: white; box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); } 
        }
        
        @keyframes pulso-naranja { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.5; } 
        }

        /* TEXTOS DE LA TARJETA */
        .nombre { 
            font-size: 1.3em; 
            font-weight: 800; 
            color: white; 
            line-height: 1.1; 
            display: flex; 
            align-items: center;
        }
        
        .descripcion-servicio { 
            font-size: 0.75em; 
            color: var(--acento-proceso); 
            font-weight: 600; 
            letter-spacing: 1px; 
            text-transform: uppercase; 
            background: rgba(212, 175, 55, 0.1); 
            padding: 2px 6px; 
            border-radius: 4px; 
            width: fit-content; 
            margin-top: 2px;
        }
        
        .turno.listo .descripcion-servicio { 
            color: var(--acento-listo); 
            background: rgba(16, 185, 129, 0.1); 
        }
        
        .turno.en-turno .descripcion-servicio { 
            color: var(--blue); 
            background: rgba(59, 130, 246, 0.1); 
        }
        
        /* BLOQUE DEL RELOJ REGRESIVO */
        .bloque-tiempo { 
            text-align: right; 
            min-width: 90px; 
            display: flex; 
            flex-direction: column; 
            align-items: flex-end; 
            justify-content: center;
        }
        
        .texto-estimado { 
            font-size: 0.65em; 
            color: var(--texto-secundario); 
            font-weight: 600; 
            letter-spacing: 1px; 
            text-transform: uppercase; 
            margin-bottom: 2px;
        }
        
        .timer-regresivo { 
            font-size: 1.5em; 
            font-weight: 800; 
            color: var(--acento-proceso); 
            font-variant-numeric: tabular-nums; 
            line-height: 1;
        }
        
        .turno.en-turno .timer-regresivo { color: var(--blue); }
        
        .hora-fija-tv { 
            font-size: 0.75em; 
            color: var(--texto-secundario); 
            margin-top: 2px; 
            font-weight: 600; 
            letter-spacing: 1px;
        }
        
        .status-txt-listo { 
            font-size: 1.5em; 
            font-weight: 800; 
            color: var(--acento-listo); 
            text-transform: uppercase; 
        }

        /* ==========================================
           CARRUSEL DE PAUSADOS (MARQUESINA)
        ========================================== */
        .barra-pausados { 
            background: #151A2B; 
            border: 1px solid var(--purple); 
            border-radius: 8px; 
            padding: 8px 15px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.15); 
            animation: entrada 0.5s ease-out; 
            margin-top: 5px;
        }
        
        .titulo-pausados-tv { 
            color: var(--purple); 
            font-weight: 800; 
            font-size: 0.9em; 
            text-transform: uppercase; 
            white-space: nowrap; 
            letter-spacing: 1px;
        }
        
        .contenedor-pausados { 
            display: flex; 
            flex: 1; 
            overflow: hidden; 
            align-items: center; 
        }
        
        .badge-pausado { 
            background: rgba(139, 92, 246, 0.15); 
            color: #C4B5FD; 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-weight: 600; 
            font-size: 0.85em; 
            border: 1px solid rgba(139, 92, 246, 0.3); 
            margin-right: 15px; 
            display: inline-block;
        }

        .badge-vip-tv { 
            background: var(--acento-proceso); 
            color: black; 
            font-size: 0.5em; 
            padding: 3px 6px; 
            border-radius: 4px; 
            vertical-align: middle; 
            margin-left: 8px; 
            letter-spacing: 1px;
        }

        /* ==========================================
           VISTA 2: ANUNCIOS DINÁMICOS
        ========================================== */
        #vistaPromos { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            transition: opacity 1s ease-in-out; 
            opacity: 0; 
            z-index: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #000; 
            border-radius: 10px; 
            overflow: hidden; 
        }
        
        #contenedorMedios { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .promo-medio { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            opacity: 0; 
            transition: opacity 1s ease-in-out; 
            filter: brightness(0.8); 
        }
        
        .promo-medio.activa { opacity: 1; }
        
        .aviso-retorno { 
            position: absolute; 
            bottom: 20px; 
            background: rgba(0,0,0,0.8); 
            padding: 10px 20px; 
            border-radius: 20px; 
            border: 1px solid var(--acento-proceso); 
            color: white; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            font-size: 0.8em; 
            z-index: 20; 
            backdrop-filter: blur(5px); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); 
        }

        /* ==========================================
           QR FLOTANTE Y PANTALLA DE INICIO
        ========================================== */
        .qr-flotante { 
            position: fixed; 
            bottom: 15px; 
            right: 15px; 
            background: var(--bg-caja); 
            border: 1px solid var(--acento-proceso); 
            border-radius: 10px; 
            padding: 10px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.6); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            z-index: 50; 
            animation: flotar 4s ease-in-out infinite; 
            backdrop-filter: blur(10px);
        }
        
        .qr-texto { 
            text-align: center; 
            font-size: 10px; 
            font-weight: 600; 
            color: var(--texto-secundario); 
            margin-bottom: 5px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        
        .qr-texto span { 
            color: var(--acento-proceso); 
            font-size: 12px; 
            display: block; 
            margin-top: 2px; 
            font-weight: 800;
        }
        
        .qr-img { width: 75px; height: 75px; border-radius: 4px; background: white; padding: 4px; }

        @keyframes flotar { 
            0% { transform: translateY(0px); } 
            50% { transform: translateY(-6px); } 
            100% { transform: translateY(0px); } 
        }

        #pantallaInicio { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: var(--bg-body); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
            flex-direction: column; 
        }
        
        .btn-inicio { 
            padding: 20px 40px; 
            font-size: 20px; 
            background: var(--acento-proceso); 
            color: #000; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 800; 
            text-transform: uppercase; 
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4); 
            transition: 0.3s; 
            letter-spacing: 2px;
        }
        
        .btn-inicio:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div id="pantallaInicio">
        <h1 style="color: var(--acento-proceso); margin-bottom: 30px; letter-spacing:8px; font-weight:300;">MONITOR <strong style="font-weight:800;">TV</strong></h1>
        <button class="btn-inicio" onclick="iniciarSistema()">ENCENDER PANTALLA</button>
        <p style="color: var(--texto-secundario); margin-top: 20px; font-size: 13px; letter-spacing: 2px;">Sistema de Producción Deluxe</p>
    </div>

    <div class="header-deluxe">
        <h1 class="logo-tv">ESTUDIO <span>DELUXE</span></h1>
        <h1 id="reloj">00:00:00</h1>
    </div>

    <div id="pantallaDinamica">
        
        <div id="vistaColas">
            <div class="columnas-principales">
                <div class="columna">
                    <h2 style="color:var(--acento-proceso); text-align: center; letter-spacing: 3px; font-weight: 300;">⏳ EN PROCESO</h2>
                    <div id="listaProceso" style="overflow-y: auto; padding-right: 5px; flex:1;"></div>
                </div>
                <div class="columna">
                    <h2 style="color:var(--acento-listo); text-align: center; letter-spacing: 3px; font-weight: 300;">✅ PARA ENTREGAR</h2>
                    <div id="listaListos" style="overflow-y: auto; padding-right: 5px; flex:1;"></div>
                </div>
            </div>
            
            <div class="barra-pausados" id="barraPausadosContainer" style="display: none;">
                <div class="titulo-pausados-tv">⏸️ PAUSADOS:</div>
                <div class="contenedor-pausados">
                    <marquee id="listaPausadosTv" scrollamount="6" scrolldelay="50"></marquee>
                </div>
            </div>
        </div>

        <div id="vistaPromos">
            <div id="contenedorMedios"></div>
            <div class="aviso-retorno">Tu turno aparecerá en pantalla en breve...</div>
        </div>
    </div>

    <div class="qr-flotante">
        <div class="qr-texto">
            ¿Deseas salir?
            <span>Rastrea tu orden</span>
        </div>
        <img src="qr-code.png" alt="QR" class="qr-img">
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAn0H-50sbh8sMcqn_k8IlVnJX6ko58ws4",
            authDomain: "sistemafotos-cf459.firebaseapp.com",
            databaseURL: "https://sistemafotos-cf459-default-rtdb.firebaseio.com",
            projectId: "sistemafotos-cf459",
            storageBucket: "sistemafotos-cf459.firebasestorage.app",
            messagingSenderId: "599045837547",
            appId: "1:599045837547:web:7bb72110d3cf36739ea4ae"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let primeraCarga = true;
        let ultimosListos = [];
        let totalFila = 0;
        let timerInactividad;
        let timerRetorno;
        window.ultimoCP = 0; 
        
        let listaMediosGlobal = [];
        let indexMedio = 0;
        let timerCarrusel;

        let vozHabilitada = true; 
        
        function iniciarSistema() {
            if ('speechSynthesis' in window) {
                let msgVacio = new SpeechSynthesisUtterance('');
                msgVacio.volume = 0;
                window.speechSynthesis.speak(msgVacio);
            }
            
            document.getElementById('pantallaInicio').style.display = 'none';
            
            db.ref('configuracion/tvVoz').on('value', snap => {
                if(snap.exists()) vozHabilitada = snap.val().activo;
            });
            
            cargarConfiguracionTV();
            escucharTurnos();
            resetLogicaVista();
            setInterval(actualizarCronometros, 1000);
        }

        // =========================================================
        // REPRODUCTOR DE ANUNCIOS
        // =========================================================
        function cargarConfiguracionTV() {
            db.ref('configuracion/tv/medios').on('value', snap => {
                const cont = document.getElementById('contenedorMedios');
                cont.innerHTML = ''; 
                listaMediosGlobal = [];
                
                if(snap.exists()) {
                    snap.forEach(child => {
                        const m = { id: child.key, ...child.val() };
                        listaMediosGlobal.push(m);
                        if(m.tipo === 'video') {
                            cont.innerHTML += `<video id="med_${m.id}" class="promo-medio" src="${m.url}" muted playsinline></video>`;
                        } else {
                            cont.innerHTML += `<img id="med_${m.id}" class="promo-medio" src="${m.url}">`;
                        }
                    });
                } else {
                    cont.innerHTML = `<img id="med_default" class="promo-medio activa" src="logo.png" style="object-fit: contain; filter: invert(1); padding: 50px;">`;
                    listaMediosGlobal.push({ id: 'default', tipo: 'imagen', duracion: 15 });
                }
                
                clearTimeout(timerCarrusel); 
                indexMedio = 0; 
                reproducirSiguienteMedio();
            });
        }

        function reproducirSiguienteMedio() {
            if (listaMediosGlobal.length === 0) return;
            
            document.querySelectorAll('.promo-medio').forEach(el => {
                el.classList.remove('activa');
                if (el.tagName === 'VIDEO') el.pause();
            });
            
            const actual = listaMediosGlobal[indexMedio];
            const el = document.getElementById('med_' + actual.id);
            
            if (el) {
                el.classList.add('activa');
                if (actual.tipo === 'video') { 
                    el.currentTime = 0; 
                    el.play().catch(e => console.log(e)); 
                }
            }
            
            const duracionMs = (actual.duracion || 10) * 1000;
            indexMedio = (indexMedio + 1) % listaMediosGlobal.length;
            timerCarrusel = setTimeout(reproducirSiguienteMedio, duracionMs);
        }

        function resetLogicaVista() {
            clearTimeout(timerInactividad); 
            clearTimeout(timerRetorno);
            
            document.getElementById('vistaColas').style.opacity = '1'; 
            document.getElementById('vistaColas').style.zIndex = '5';
            
            document.getElementById('vistaPromos').style.opacity = '0'; 
            document.getElementById('vistaPromos').style.zIndex = '1';
            
            timerInactividad = setTimeout(mostrarAnuncios, 20000);
        }

        function mostrarAnuncios() {
            document.getElementById('vistaPromos').style.opacity = '1'; 
            document.getElementById('vistaPromos').style.zIndex = '5';
            
            document.getElementById('vistaColas').style.opacity = '0'; 
            document.getElementById('vistaColas').style.zIndex = '1';
            
            if (totalFila > 0) {
                timerRetorno = setTimeout(resetLogicaVista, 10000);
            }
        }

        function vocearIA(nombre) {
            const audio = new Audio('listo.mp3');
            audio.play().then(() => {
                if(vozHabilitada) {
                    setTimeout(() => {
                        const msg = new SpeechSynthesisUtterance(`Atención. El pedido de ${nombre}, está listo.`);
                        msg.lang = 'es-MX'; 
                        msg.rate = 0.85; 
                        window.speechSynthesis.speak(msg);
                    }, 1200);
                }
            }).catch(e => console.log("Bloqueo de Audio:", e));
        }

        // =========================================================
        // CRONÓMETRO REGRESIVO
        // =========================================================
        function actualizarCronometros() {
            document.querySelectorAll('.timer-regresivo').forEach(el => {
                const entrega = parseInt(el.getAttribute('data-entrega'));
                if(!entrega) return;
                
                const ahora = Date.now();
                let diff = Math.floor((entrega - ahora) / 1000); 
                
                if (diff <= 0) { 
                    el.innerHTML = '<span style="color: #F59E0B; animation: pulso-naranja 1s infinite; font-size: 0.7em;">¡POR SALIR!</span>';
                } else {
                    const min = Math.floor(diff / 60); 
                    const sec = diff % 60;
                    el.innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
                }
            });
        }

        // =========================================================
        // MOTOR PRINCIPAL DE COLAS DE TV (LÍMITE A 5 LISTOS)
        // =========================================================
        function escucharTurnos() {
            db.ref('turnos').on('value', snapshot => {
                const listaP = document.getElementById('listaProceso'); 
                const listaL = document.getElementById('listaListos');
                const listaPausadosTv = document.getElementById('listaPausadosTv'); 
                const barraPausadosCont = document.getElementById('barraPausadosContainer');
                
                listaP.innerHTML = ''; 
                listaL.innerHTML = ''; 
                let htmlPausados = '';
                
                let pendientes = [];
                let listos = [];
                let pausados = [];

                if(snapshot.exists()) {
                    snapshot.forEach(child => {
                        let val = child.val();
                        if(val.estado === 'pendiente') {
                            pendientes.push({id: child.key, ...val});
                        } else if(val.estado === 'listo') {
                            listos.push({id: child.key, ...val});
                        } else if(val.estado === 'pausado') {
                            pausados.push({id: child.key, ...val});
                        }
                    });
                }
                
                // ORDENAR PENDIENTES (El que sale primero, va arriba)
                pendientes.sort((a, b) => a.timestampEntrega - b.timestampEntrega);
                
                // ORDENAR LISTOS (Los finalizados más recientemente, van arriba)
                listos.sort((a, b) => (b.timestampEstado || b.timestampEntrega) - (a.timestampEstado || a.timestampEntrega));

                // 1. GENERAR COLUMNA "EN PROCESO"
                let esPrimeroEnFila = true;
                
                pendientes.forEach(t => {
                    const descripcionHtml = t.servicio ? `<span class="descripcion-servicio">${t.servicio}</span>` : '';
                    const etiquetaVIP = t.esVIP ? `<span class="badge-vip-tv">⭐ VIP</span>` : '';
                    let claseExtra = '';
                    let etiquetaAtendiendo = '';

                    // Al primero de la fila lo iluminamos de Azul (Está siendo atendido)
                    if (esPrimeroEnFila) {
                        claseExtra = 'en-turno';
                        etiquetaAtendiendo = `<span class="badge-en-turno">👉 EN TURNO</span>`;
                        esPrimeroEnFila = false;
                    }

                    listaP.innerHTML += `
                        <div class="turno ${claseExtra}">
                            <div class="turno-info">
                                <span class="nombre">${t.nombre} ${etiquetaAtendiendo} ${etiquetaVIP}</span>
                                ${descripcionHtml}
                            </div>
                            <div class="bloque-tiempo">
                                <span class="texto-estimado">ESTIMADO</span>
                                <span class="timer-regresivo" data-entrega="${t.timestampEntrega}">--:--</span>
                                <span class="hora-fija-tv">⏰ ${t.horaFormateada}</span>
                            </div>
                        </div>`;
                });

                // 2. GENERAR COLUMNA "LISTOS" (LÍMITE A LOS 5 MÁS RECIENTES)
                const MAX_LISTOS = 5; 
                let listosMostrados = listos.slice(0, MAX_LISTOS);

                listosMostrados.forEach(t => {
                    const descripcionHtml = t.servicio ? `<span class="descripcion-servicio">${t.servicio}</span>` : '';
                    const etiquetaVIP = t.esVIP ? `<span class="badge-vip-tv">⭐ VIP</span>` : '';
                    
                    listaL.innerHTML += `
                        <div class="turno listo">
                            <div class="turno-info">
                                <span class="nombre">${t.nombre} ${etiquetaVIP}</span>
                                ${descripcionHtml}
                            </div>
                            <span class="status-txt-listo">RECOGER</span>
                        </div>`;
                });

                // 3. GENERAR BARRA DE PAUSADOS (MARQUESINA INFERIOR)
                pausados.forEach(t => {
                    htmlPausados += `<span class="badge-pausado">${t.nombre} - ${t.servicio}</span>`;
                });

                // ACTUALIZAR ESTADOS GLOBALES Y VISIBILIDAD
                actualizarCronometros();
                totalFila = pendientes.length + listos.length;

                if (pausados.length > 0) { 
                    listaPausadosTv.innerHTML = htmlPausados; 
                    barraPausadosCont.style.display = 'flex'; 
                } else { 
                    barraPausadosCont.style.display = 'none'; 
                    listaPausadosTv.innerHTML = ''; 
                }

                // 4. LÓGICA DE AUDIOS (VOCEO Y CAMPANITA)
                let listosActualesIds = listos.map(t => t.id);
                
                if (!primeraCarga) {
                    // Solo vocear si el ID es nuevo en la lista de listos
                    listos.forEach(nuevo => { 
                        if (!ultimosListos.includes(nuevo.id)) {
                            vocearIA(nuevo.nombre); 
                        }
                    });
                    
                    // Solo tocar campanita si hay MÁS pendientes que antes (alguien nuevo entró a la fila)
                    if (pendientes.length > window.ultimoCP) {
                        new Audio('nuevo.mp3').play().catch(e => console.log(e));
                    }
                    
                    resetLogicaVista();
                }

                ultimosListos = listosActualesIds; 
                window.ultimoCP = pendientes.length; 
                primeraCarga = false;
            });
        }

        // Iniciar reloj digital de la cabecera
        setInterval(() => { 
            document.getElementById('reloj').innerText = new Date().toLocaleTimeString('es-MX', {hour12: false}); 
        }, 1000);

    </script>
</body>
</html>
